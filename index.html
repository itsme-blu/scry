<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scry</title>
<link rel="icon" href="brand/scry-icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070B18">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ---------- tokens (Horizon family) ---------- */
:root{--bg:#0E1427;--rail:#0B1122;--surface:#18213A;--surface-2:#202B48;--surface-3:#28345A;--line:#2E3A5C;--line-soft:#253153;
--ink:#EEF1F8;--muted:#A7B0C6;--faint:#8792B0;
--primary:#3FD0B6;--on-primary:#0E1427;--sun:#E8A33D;--sun-soft:#F2C57C;
--ok:#3FD0B6;--ok-bg:rgba(63,208,182,.12);--wait:#F2C57C;--wait-bg:rgba(232,163,61,.14);
--ai:#8FB4E8;--ai-bg:rgba(143,180,232,.13);--risk:#F08A7E;--risk-bg:rgba(240,138,126,.13);--idle:#A7B0C6;--idle-bg:rgba(167,176,198,.10);
--display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
--r:16px;--gap:16px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.2} h2{font-size:16px} h3{font-size:14px}
a{color:var(--sun-soft)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono)} .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .xs{font-size:12px}
.pos{color:var(--ok)} .neg{color:var(--risk)} .warn{color:var(--sun-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:17px}
.mark{width:30px;height:30px;flex:none;display:block}
.rail .brand{padding:0 8px}
.demo-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ai);background:var(--ai-bg);border:1px solid rgba(143,180,232,.3);padding:3px 9px;border-radius:999px;white-space:nowrap}
.demo-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ai)}
.rail .demo-pill{margin:12px 8px 18px;align-self:flex-start}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a.on{background:var(--surface-2);color:var(--ink)}
.nav a.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--primary)}
.nav .ni{width:20px;text-align:center;font-size:15px}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font:600 11px/20px var(--mono);text-align:center;background:var(--ai-bg);color:var(--ai)}
.count.risk{background:var(--risk-bg);color:var(--risk)}
.rail .foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--faint);line-height:1.45}
main{min-width:0;padding:28px 36px 120px;max-width:1280px;width:100%}
.mhead{display:none}
.tabbar{display:none}
.fab{position:fixed;right:28px;bottom:28px;height:54px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:20}
.fab b{font-size:24px;line-height:1;font-weight:600}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
.ph .sub{color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.demo-banner{display:flex;gap:12px;align-items:center;background:var(--ai-bg);border:1px solid rgba(143,180,232,.3);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:13.5px;margin-bottom:18px}
.demo-banner b{color:var(--ai)}
.demo-banner button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:var(--gap)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card>h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card>h2 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px}
.card>h2 small a{color:var(--muted)} .card>h2 small a:hover{color:var(--ink)}
.mb{margin-bottom:var(--gap)}
.lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.big{font-family:var(--mono);font-weight:600;font-size:clamp(24px,2.4vw,32px);line-height:1.15;margin-top:4px;white-space:nowrap}
.mid{font-family:var(--mono);font-weight:600;font-size:clamp(17px,1.6vw,21px);margin-top:3px;white-space:nowrap}
.hero{background:linear-gradient(135deg,#1F2D52 0%,#18213A 70%);border-color:#3A4A74}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:14px}
.split i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.empty{color:var(--faint);padding:18px 0;text-align:center;font-size:14px}
.stack>*+*{margin-top:var(--gap)}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line-soft);border-radius:8px;min-width:0}
.item:first-child{border-top:0}
.item.click{cursor:pointer} .item.click:hover{background:var(--surface-2)}
.ico{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none}
.item .main{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--mono);font-weight:600;white-space:nowrap;text-align:right}
.day{display:flex;justify-content:space-between;padding:16px 6px 6px;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.day:first-child{padding-top:2px}
.datebox{width:42px;height:46px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.datebox b{font:600 17px var(--mono)} .datebox span{font-size:9.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.datebox.late{background:var(--risk-bg);color:var(--risk)} .datebox.late span{color:var(--risk)}
.datebox.soon{background:var(--wait-bg);color:var(--sun-soft)} .datebox.soon span{color:var(--sun-soft)}

/* ---------- controls ---------- */
.chips{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.chips button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:9px;font-weight:500;font-size:13.5px;white-space:nowrap}
.chips button.on{background:var(--surface-3);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:500;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--risk);border-color:rgba(240,138,126,.4);background:none}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--idle-bg);color:var(--idle);vertical-align:1px;white-space:nowrap}
.badge.db{background:var(--wait-bg);color:var(--sun-soft)} .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.risk{background:var(--risk-bg);color:var(--risk)} .badge.ai{background:var(--ai-bg);color:var(--ai)}
.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.monthnav b{min-width:128px;text-align:center;font-family:var(--display);font-size:14px}
.iconbtn{border:0;background:none;width:32px;height:30px;border-radius:9px;color:var(--muted);font-size:17px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding-left:34px}
.search::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--faint);font-size:16px}

/* ---------- bars ---------- */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.bar i.warn{background:var(--sun)} .bar i.over{background:var(--risk)} .bar i.blue{background:var(--ai)}
.meter{margin-bottom:13px}
.meter:last-child{margin-bottom:0}
.meter .row{gap:8px;margin-bottom:6px;flex-wrap:nowrap}
.meter .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- review tray ---------- */
.tray{border-color:rgba(143,180,232,.45);background:linear-gradient(180deg,rgba(143,180,232,.07),transparent 60%),var(--surface)}
.tray>h2 .ttl{display:flex;align-items:center;gap:8px;white-space:nowrap}
.card>h2{flex-wrap:wrap}
.rv{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 6px;border-top:1px solid var(--line-soft)}
.rv:first-of-type{border-top:0}
.bankdot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 15px var(--display);background:var(--surface-2)}
.rv .what{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .what .amt{font-size:15px;margin-right:6px}
.rv .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rv .raw{grid-column:2/4;font-size:12px;color:var(--faint);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .acts{display:flex;gap:6px;align-items:center}

/* ---------- budgets ---------- */
.assign{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:var(--gap)}
.assign.ok{background:var(--ok-bg);border-color:rgba(63,208,182,.35)} .assign.over{background:var(--risk-bg);border-color:rgba(240,138,126,.4)} .assign.zero{background:var(--surface)}
.status-pills{display:flex;gap:8px;flex-wrap:wrap}
.bud{display:grid;grid-template-columns:minmax(0,1.3fr) 132px minmax(0,1.2fr) 128px;gap:16px;align-items:center;padding:11px 6px;border-top:1px solid var(--line-soft)}
.bud.head{border-top:0;padding-top:0;color:var(--faint);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bud .cn{display:flex;align-items:center;gap:10px;font-weight:500;min-width:0}
.bud .cn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud input{width:100%;text-align:right;font-family:var(--mono)}
.bud .left{text-align:right;font-family:var(--mono);font-size:13px}

/* ---------- forms ---------- */
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-wrap{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.amount-wrap:focus-within{border-color:var(--primary)}
.amount-wrap .cur{font:600 22px var(--mono);color:var(--faint)}
.amount-in{font-family:var(--mono);font-size:32px;font-weight:600;text-align:center;border:0;background:none;width:100%;max-width:260px;padding:6px 0}
.amount-in:focus,.amount-in:focus-visible{outline:none;border:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--surface-2);color:var(--ink)}
.seg button.on.e{color:var(--risk);background:var(--risk-bg)} .seg button.on.i{color:var(--ok);background:var(--ok-bg)} .seg button.on.t{color:var(--ai);background:var(--ai-bg)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--muted)}
.catpick button.on{border-color:var(--primary);color:var(--ink);background:var(--ok-bg)}
.quickdates{display:flex;gap:6px}
.quickdates button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.hint{font-size:12px;color:var(--faint)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,8,18,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:100%;max-width:500px;max-height:92vh;overflow:auto;padding:22px}
.modal.wide{max-width:860px}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal header button{background:none;border:0;color:var(--muted);font-size:24px;line-height:1}
.modal footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal footer .left{margin-right:auto}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;font-size:12px;font-weight:600;color:var(--faint);padding-top:8px;border-top:3px solid var(--line)}
.steps span.on{color:var(--ink);border-color:var(--primary)} .steps span.done{color:var(--muted);border-color:rgba(63,208,182,.45)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.drop input{margin-top:10px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11.5px;color:var(--faint);text-align:center;font-weight:700;letter-spacing:.04em}
.cal .c{min-height:92px;background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:6px;font-size:12px;overflow:hidden;min-width:0}
.cal .c.out{opacity:.35} .cal .c.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal .c .n{color:var(--faint);font-weight:600;margin-bottom:3px}
.cal .c.today .n{color:var(--primary)}
.cal .pill{background:var(--surface-2);border-radius:6px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal .pill.db{background:var(--wait-bg);color:var(--sun-soft)} .cal .pill.late{background:var(--risk-bg);color:var(--risk)} .cal .pill.paid{opacity:.55;text-decoration:line-through}

/* ---------- misc ---------- */
.gate-hero{text-align:center;margin:-4px 0 22px}
.gate-hero img{width:104px;height:104px;display:block;margin:0 auto 12px;filter:drop-shadow(0 14px 32px rgba(63,208,182,.18))}
.gate-word{font:800 34px/1 var(--display);letter-spacing:-.03em}
.gate-tag{color:var(--sun-soft);font-weight:600;margin-top:6px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.t th{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
table.t td.wrap{white-space:normal}
.callout{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.callout b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--faint)} .kv dd{margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
code{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;word-break:break-all}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{max-width:460px;width:100%;padding:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:14px;max-width:calc(100vw - 32px)}

/* ---------- bank logos ---------- */
.ico:has(img.logo),.bankdot:has(img.logo){background:none;overflow:hidden;padding:0}
img.logo{width:100%;height:100%;object-fit:contain;border-radius:12px;display:block;background:#fff}
img.logo[src$="cash.svg"]{background:none}

/* ---------- Penny ---------- */
.penny-dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:linear-gradient(135deg,var(--sun),#C9802A);color:var(--on-primary);font:800 12px var(--display);flex:none}
.penny-dot.lg{width:34px;height:34px;border-radius:11px;font-size:16px}
.nav a.penny-link{color:var(--sun-soft)}
.nav a.penny-link.on{color:var(--ink)}
.penny-strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-color:rgba(232,163,61,.35);background:linear-gradient(135deg,rgba(232,163,61,.09),transparent 60%),var(--surface)}
.penny-strip .catpick{flex-basis:auto}
.penny-card{display:flex;flex-direction:column;gap:12px}
.penny-log{display:flex;flex-direction:column;gap:12px;max-height:min(60vh,620px);overflow-y:auto;padding:2px}
.pm{display:flex;gap:10px;align-items:flex-start;max-width:760px}
.pm.me{align-self:flex-end;justify-content:flex-end}
.pm .bubble{padding:10px 14px;border-radius:14px;line-height:1.55;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.pm.her .bubble{background:var(--surface-2);border-top-left-radius:4px}
.pm.me .bubble{background:var(--ok-bg);border:1px solid rgba(63,208,182,.3);border-top-right-radius:4px}
.pm .bubble.err{background:var(--risk-bg);color:var(--risk)}
.pm .bubble ul{margin:6px 0;padding-left:20px}
.pm .bubble.typing{color:var(--muted);font-style:italic}
.penny-form{display:flex;gap:10px;align-items:flex-end}
.penny-form textarea{flex:1;resize:vertical;min-height:46px;font-size:15px}

/* ================= AURORA (Blu's pick, Nov 21 2026): glass + glow, layered over the base styles ================= */
:root{--bg:#070B18;--rail:rgba(9,13,30,.72);--surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.10);--surface-3:rgba(255,255,255,.15);
